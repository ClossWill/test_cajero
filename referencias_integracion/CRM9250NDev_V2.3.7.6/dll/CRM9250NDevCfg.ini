[CRM9250NDev]
; 验钞模式								0-真钞			15-仿真钞
NOTEVALIDMODE=0                
; 单次存款极限张数设置
DEPOSITLIMIT=200
; 是否记录钞票信息(包括序列号信息)		0-不记录		1-记录
NOTEINFOFLAG=1
; 钞口有钞票时是否允许取款。0表示不允许，1表示允许。若未配置或配置非法，则默认为0
DispenseNfHasNotes=0
; 机芯速度级别。0表示正常，1表示加速。若未配置或配置非法，则默认为0
DevSpeedLevel=0
; 处理钞票是否带孔						0-不带孔		1-带孔
CavityNote=0
; OCR类型。0表示黑白图片，1表示彩色图片。若未配置，则默认为0
OCRTYPE=0
; 当笔点钞连续拒钞过多时是否允许继续点钞。0表示不允许，1表示允许，2表示不判断连续拒钞。若未配置或配置非法，则默认为0
CashCountRejectMany=0
; 机芯日志保存目录，若未配置或配置非法(目录不存在)，则默认为当前目录下的CRM9250NLog子目录
DevLogDirectory=CRM9250NLog
; NV日志保存目录，若未配置或配置非法(目录不存在)，则默认为当前目录下的CRM9250NNVLog子目录
NvLogDirectory=CRM9250NNVLog
; 是否记录NV日志，0表示不记录，1表示记录（默认）
SaveNvLog=1
; 机芯日志记录级别，0表示不记录，1表示记录，2表示仅在硬件报错时才记录。若未配置或配置非法，则默认为1
DevLogLevel=1
; 机芯与NV日志保存天数，若未配置或配置非法，则默认为180
DevLogRemainDays=180
;机芯与NV日志是否压缩 0表示不压缩，1表示压缩
ZipEnable=1
; 清空机芯USB缓冲区的级别。0表示不清空，1表示执行初始化设置指令和初始化指令前清空。不配置或配置值非法时，则默认为1
ClearDevBufLevel=1
;主密钥更新超时时间(ms)
UpdateMasterKeyWait=60000
;招行钞票属性条款配置，0，关闭，1开启。默认0关闭。
ArticleCMB=0
; 是否开通36条款操作，0表示不开通，非0表示开通
Article36=0
; L2类钞票的去向，仅在开通36条款操作时才有效。0表示AC，1~4表示RC1~RC4，5表示LRB，6表示钞口。不配置或配置值非法时，则默认为0,8表示AC2，9~20表示RC5~RC16
L2Notes=0
; L3类钞票的去向，仅在开通36条款操作时才有效。0表示AC，1~4表示RC1~RC4，5表示LRB，6表示钞口。不配置或配置值非法时，则默认为0,8表示AC2，9~20表示RC5~RC16
L3Notes=0
; L4B类钞票的去向，仅在开通36条款操作时才有效。0表示AC，1~4表示RC1~RC4，5表示LRB，6表示钞口。不配置或配置值非法时，则默认为0,8表示AC2，9~20表示RC5~RC16
L4BNotes=0
; 取消存款是否没收L2类钞票，仅在开通36条款操作时才有效。0表示不没收，1表示没收。不配置或配置值非法时，则默认为0
CancelDepositL2Notes=0
; 取消存款是否没收L3类钞票，仅在开通36条款操作时才有效。0表示不没收，1表示没收。不配置或配置值非法时，则默认为0
CancelDepositL3Notes=0
; 回收是否执行36条款，仅在开通36条款操作时才有效。0表示不执行，非0表示执行
RetractArticle36=0
; L1类钞票的回收区域，仅在回收执行36条款时才有效。0表示AC，1~4表示RC1~RC4，5表示LRB，6表示钞口，7表示回收至"回收区域"指定处。不配置或配置值非法时，则默认为0,8表示AC2，9~20表示RC5~RC16
RetractL1Notes=0
; L2类钞票的回收区域，仅在回收执行36条款时才有效。0表示AC，1~4表示RC1~RC4，5表示LRB，6表示钞口，7表示回收至"回收区域"指定处。不配置或配置值非法时，则默认为0,8表示AC2，9~20表示RC5~RC16
RetractL2Notes=0
; L3类钞票的回收区域，仅在回收执行36条款时才有效。0表示AC，1~4表示RC1~RC4，5表示LRB，6表示钞口，7表示回收至"回收区域"指定处。不配置或配置值非法时，则默认为0,8表示AC2，9~20表示RC5~RC16
RetractL3Notes=0
; L4B类钞票的回收区域，仅在回收执行36条款时才有效。0表示AC，1~4表示RC1~RC4，5表示LRB，6表示钞口，7表示回收至"回收区域"指定处。不配置或配置值非法时，则默认为0,8表示AC2，9~20表示RC5~RC16
RetractL4BNotes=0
;审计拒钞转成假钞,1启用，0不启用使用硬件返回值
ACVALID=0
;点钞拒钞转成假钞,1启用，0不启用使用硬件返回值
CashinNFVALID=0
;存款拒钞转成真钞,1启用，0不启用使用硬件返回值
StoreACVALID=0
;取款拒钞转成假钞,1启用，0不启用使用硬件返回值
DispenseACVALID=0
;审计时OCR数据库及小图记录策略配置,0不启用(默认),1只记录去AC箱的
AudiOCRStrategy=0
;OCR策略是否启用， 0，不启用；1, 启用
OcrStrategy=0
;可疑字符识别策略，0, 识别；1, 不识别
RecognitionSuspected=1
;取款策略，0, 拒钞；1, 出钞
DispenseStrategy=1
;存款策略，0, 回收；1, 循环
StoreMoneyStrategy=1
;点钞策略，0, 拒钞；1, 出钞
CashCountStrategy=0
;取款第一段字符个数
DispenseOcrNum1=4
;取款第一段不识别个数
DispenseOcrUnrecognized1=1
;取款第二段字符个数
DispenseOcrNum2=6
;取款第二段不识别个数
DispenseOcrUnrecognized2=2
;存款第一段字符个数
StoreMoneyOcrNum1=4
;存款第一段不识别个数
StoreMoneyOcrUnrecognized1=1
;存款第二段字符个数
StoreMoneyOcrNum2=6
;存款第二段不识别个数
StoreMoneyOcrUnrecognized2=2
;点钞第一段字符个数
CashCountOcrNum1=4
;点钞第一段不识别个数
CashCountOcrUnrecognized1=1
;点钞第二段字符个数
CashCountOcrNum2=6
;点钞第二段不识别个数
CashCountOcrUnrecognized2=2
;机芯处理速度策略，0正常，1提速
SpeedStrategy=0
;取款拒钞去向配置，0去NE+复位钞箱,1去AC+复位钞箱(默认)，2去NE+不复位钞箱，3去AC+不复位钞箱
DispenseRejectGoto=1
;UNFIX 4B类区分配置,0不启用(默认)，1启用
UnfixStrategy=0
;0表示UNFIT类钞票存款被拒钞(存入DC或者AC箱),1表示UNFIT类钞票不被拒钞(优先存入RC箱)
UnfixStoreMoneyReject=0
;0表示UNFIT类钞票取款被拒钞,1表示UNFIT类钞票不被拒钞
UnfixDispenseReject=0
;存款Unfix去向 0:AC; 1:只存RC钱箱; 2:LRB; 3:DC; 4：RC循环钱箱
UnfixNotes=0
;补偿张数策略使能(默认禁用),0禁用；1启用
NumCorrectStrategy=0
;银行特殊功能配置;0通用功能(默认)，1招行，2工行，3建行
BankSpecialFun=0
;退钞电机设置;0通用功能(默认)，1 MF03电机退钞模式
QuitMotorSetting=0
;点钞动作设置;0接收没有对应钞箱的钞票进AC(默认);1拒收没有对应钞箱的钞票
CashCountAction1=0
;存款合并LRB的明细到AC;0不合并(默认)，1合并
MergeLRBToAC=0
;钞箱明细配置;0 AC明细包含Unknow钞票(默认)，  1 AC明细不含Unknow钞票
DenomDetails=0;
;AC箱满报告处理 0:上报错误码(默认)；1:上报警告码 
ACFullReport=0
;多币种拒钞策略 0:根据NV识别结果拒钞；1：根据第一张点钞的币种进行拒钞
CashCountRejectStrategy=0
;RC满后的扩充容量，默认0
RCFullStoreMoneyNum=0
;RC满后的扩充容量，默认0
ACFullStoreMoneyNum=0
;俄罗斯RCB 0:不启用(默认)；1：启用
ArticleRussia=0
;ECB 模式主控判断假钞、NV判断真钞时；0:输出主控判断结果(默认)；1:输出NV识别结果
ECBValidity=0


[OCRSettings]
;图像宽度
IMAGEWIDTH=136
;图像高度
IMAGEHEIGHT=40
;OCR图像中冠字号占比，默认2
;1-冠字号边缘背景占比少
;2-冠字号边缘背景占比多
OCRPIXELSTYLE=2
;图像保存路径
IMAGEPATH=.\CRMInfo\Images
;原图保存路径(加密存储)，该配置项为空，则不保存原图(默认不保存)。
SRCIMAGEPATH=
; 是否压缩数据库						0-不压缩		1-压缩 
CompactDatabase=0
;数据库文件路径
DATABASEPATH=.\CRMInfo
;数据库名
DATABASENAME=GRGNoteDetails.mdb
;钞票信息表名
DATABASETABLENAME=GRGNoteDetails
;主动预防还原数据库标志(0:不启用主动还原;1:启用主动还原)，主动还原定位4:00—5:00
AUTODATABASEBACKUPFALG=0
;数据库备份还原天数(默认为30天，只还原30天内数据)
DATABASEBACKUPDAYS=30
;数据库备份还原时间(默认为15天；每15天主动预防还原指定天内数据至数据库)
DATABASEBACKUPTIME=15
;数据库密码
DATABASEPASSWORD=946329A3707900E76BA0E266BB9433A1
; 是否对之前保存的未加密SQL文件进行加密：0表示加密，1(非0)不加密
SQLNOENCRYPT=1
; 保存OCR图像格式(0:BMP;1:JPG;2:PNG)
IMAGEFORMAT=0
;OCR图像百分比(只针对JPG格式，取值范围[1-100]的整数, 比如PERCENTAGE=80，表示图像压缩比为80%，动态库默认压缩比为100%)
;由于JPG为有损压缩，当压缩比低于20%时会严重影响图片的质量，因此不建议将压缩比配置为20%以下。
PERCENTAGE=100
; OCR冠字号通配符（当所有字符无法识别时代表一个字符）
;通配符只能设置为半角可见字符（不包括空格），16进制范围为0x21~0x7F，不在范围之内取值为默认字符。
WILDCARDALL=*
; OCR冠字号通配符（当有1~n-1个不支持识别的字符时代表一个字符，n指序列号字符串的总长度）
;通配符只能设置为半角可见字符（不包括空格），16进制范围为0x21~0x7F，不在范围之内取值为默认字符。
WILDCARDUNSUPPORT=*
; OCR冠字号通配符（当有1~n-1个无法识别的字符时代表一个字符，n指序列号字符串的总长度）
;通配符只能设置为半角可见字符（不包括空格），16进制范围为0x21~0x7F，不在范围之内取值为默认字符。
WILDCARDUNRECOGNIZED=?
; 非钞票OCR处理方式，默认为0，不作特殊处理
; 第0至第3比特位为1时的含义分别是：识别结果为空字符串、全为空格、全为问号、全为星号
; 第4至第7比特位为1时的含义分别是：不保存OCR小图、保存白色OCR小图、保存黑色OCR小图、保存大小为0KB的OCR小图
NONENOTEOCRFORMAT=0

;OCR图象名格式表达式 注意:表达式有冠字号情况下,上面配的冠字号通配符不能用?:\*等不能命名文件的符号(比如浦发银行需求,统配符不能配?)
;%4Y%m%d%H%M%S%s-%N%s-%3I 浦发方式
;%H%M%S%3I 交行方式
;%H%M%S%s_%T%s_%n%s_%3I   运通方式
OCRIMGFORMAT=%H%M%S%s_%T%s_%n%s_%3I
;真假值
OCRLEVEL=2=Level2,4=Level4,3=Level3
;钞票去向
OCRGODEST=00=BOCCS,01=BOCTS,02=BOCAB,03=BOCRB1,04=BOCRB2,05=BOCRB3,06=BOCRB4,0A=BOCRJSD,0B=BOCURJB
;钞票面向
OCRFACE=0=F1,1=F2
;钞票版本
OCRNOTEVER=0=9999,1990=0,1999=1,2005=2,2015=3
;钞票面值ID
OCRNOTEID=0=9999,100=1,50=2,20=3,10=4,5=5
;操作动作
OCROPERATOR=0=CashIn,1=CashInEnd,2=DISPENSE,3=RETRACT,4=RESET
;取款是否记录，1记录，0不记录
BIMGE_DISPENSE=0
;点钞是否记录，1记录，0不记录
BIMGE_CASHCOUNT=0
;存款是否记录，1记录，0不记录
BIMGE_STORE=0
;回收是否记录，1记录，0不记录
BIMGE_RETRACT=0
;审计是否记录，1记录，0不记录
BIMGE_AUDIT=0
;边点边传功能，0关，1大图边点边传，2小图边点边传,3大图小图一起边传
