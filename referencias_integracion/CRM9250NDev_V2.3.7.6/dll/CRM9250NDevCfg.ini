;0-不记录 1-记录日志(默认)
DevDriverLog =1
;日志保留天数(默认180)
RemainDays=180
AllStatusLog=0
; 在线下载配置
[CRM9250NFirmwareDownload]
; 升级CE模式	0-支持向高版本和低版本升级;	1(def)-支持向高版本升级，不支持向低版本升级; 2-不判断版本
PDL_CE_MODE=1
; 升级NV模式	0-支持向高版本和低版本升级;	1(def)-支持向高版本升级，不支持向低版本升级; 2-不判断版本 
PDL_NV_MODE=1
; 主控介质图文号配置
PDL_CE_MAINBOARD=YT2.480.0527
PDL_CE_UPPERBOARD=YT2.480.0467
PDL_CE_RC=YT2.480.129
PDL_CE_RCN=YT2.480.0385
PDL_CE_DRC=YT2.480.0680
; OCR模板图文号配置
PDL_NV_OCR=OCR_Model

; SNV3介质图文号配置
[SNV3]
PDL_NV2_DSP1=YT2.480.0455
PDL_NV2_FPGA1=YT2.480.0458
PDL_NV2_FPGA2=YT2.480.0459

[UNV1]
PDL_NV2_DSP1=YT2.480.0624
PDL_NV2_FPGA1=YT2.480.0625
PDL_NV2_FPGA2=YT2.480.0626
PDL_NV_OCR=YT2.480.0627
