;只收不付功能
[OnlyInNotOut]
;是否开启,0不开启，非0开启
;如果关闭只收不付功能后，Dest、Store、Disp等配置无效
Enable=1
;去向优先级,1：代表AC箱，2：代表只存箱，3：代表LRB箱，4：代表DC箱，5：代表RC箱
;比如Dest=1,2表示先去AC箱再去只存箱
Dest=1
;存入时的币种，最多255个币种
Store=295,294,293,292,291,290
;取款不出币种，最多255个币种
Disp=295,294,293,292,291,290

[V28001A006]
;型号规格
DevType=DT-7000H68V
;硬件版本号
HwVersion=HW:V1.0
;签发日期		
CertificationDate=2021-10-08
;是否判断失效日期,0：不判断（默认）;非0：判断有效期，数值代表年限 如2：判断有效期，有效期2年
ExpirationJudg=0 
;是否回写FSN配置项 ,0:不回写；1：回写
WriteFsnCfg=0

