;图像宽度,默认0原图大小
BIMAGEWIDTH=0
;图像高度,默认0原图大小
BIMAGEHEIGHT=0
;开启主动上传是NV通信失败是否报错,默认报错
BIMAGERRRet=1
;去向描述字段是否附加操作信息,0不附加(默认), 1附加,2附加操作信息及动作接口执行结果
GoDestOption=0

;dispense交易钞票有效性决定因素
;0与其他交易一样由OnlyCEVaild配置决定
;1由NV决定.
